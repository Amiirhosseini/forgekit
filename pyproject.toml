[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "forgekit"
version = "0.1.0"
description = "Minimal open-source agent framework — typed tools, progressive skills, dual loops, inspectable memory"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "ForgeKit Contributors" }]
keywords = [
  "agent-framework",
  "llm",
  "tools",
  "skills",
  "react",
  "multi-agent",
  "hermes",
  "mcp",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "typer>=0.12",
  "rich>=13.7",
  "pyyaml>=6.0",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "mcp>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "httpx",
]

[project.urls]
Homepage = "https://amiirhosseini.com/forgekit/"
Documentation = "https://github.com/Amiirhosseini/forgekit#readme"
Repository = "https://github.com/Amiirhosseini/forgekit"
Issues = "https://github.com/Amiirhosseini/forgekit/issues"

[project.scripts]
forgekit = "forgekit.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/forgekit"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["B008"]  # Typer Argument/Option defaults are intentional
